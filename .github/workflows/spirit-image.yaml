# Builds the Spirit image of Twenty and pushes it to ghcr.io.
# Push a tag like v2.41.0-spirit.1 on the branch `spirit`. The image gets the same tag.
name: Spirit image

permissions:
  contents: read
  packages: write

on:
  push:
    tags:
      - 'v*-spirit.*'

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  build:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Twenty reads APP_VERSION as a semver release, so it gets the upstream version without -spirit.N.
      - name: Read versions
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          echo "app=${TAG%%-spirit.*}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          platforms: linux/amd64
          build-args: APP_VERSION=${{ steps.version.outputs.app }}
          push: true
          tags: ${{ steps.version.outputs.image }}:${{ github.ref_name }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
